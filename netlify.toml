# Netlify Configuration for Glimpse Audit App

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Environment variables for Netlify Functions (set in Netlify Dashboard)
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# PSI_API_KEY
# OPENAI_API_KEY

[functions]
  # Increase timeout for run-audit function (max 26s for free tier, 60s for paid)
  # Note: run-audit is designed to be async, so it updates DB and returns quickly
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Note: Netlify functions are automatically handled, no redirect needed

